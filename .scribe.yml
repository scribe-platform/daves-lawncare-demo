site: daves-lawncare-demo
siteName: Dave's Lawn Care
turnstileSiteKey: 0x4AAAAAAFHtLCWg1S7IznJp
contactCollection: inquiries
umamiWebsiteId: 8274c1c4-a731-4142-bb1b-4ece7cbb263a
umamiScriptUrl: https://analytics.weaverdigital.io/script.js
collections:
  - name: posts
    label: Blog Posts
    description: Articles shown on the site's blog page.
    path: content/blog
    format: yaml-frontmatter
    view:
      primary: title
      sort: date
    fields:
      - name: title
        type: string
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: date
        type: date
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: author
        type: string
        required: false
        hidden: false
        readonly: false
        isBody: false
      - name: tags
        type: string
        required: false
        hidden: false
        readonly: false
        isBody: false
        list: true
      - name: body
        type: rich-text
        required: false
        hidden: false
        readonly: false
        isBody: true
    form: false
  - name: packages
    label: Service Packages
    description: Pricing plans shown on the site's services page.
    path: content/packages
    format: yaml-frontmatter
    view:
      primary: title
      sort: displayOrder
      fields:
        - title
        - monthlyPrice
        - isActive
        - displayOrder
    fields:
      - name: title
        type: string
        label: Title
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: monthlyPrice
        type: number
        label: Monthly Price ($)
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: isActive
        type: boolean
        label: Active (show on website)
        required: false
        default: true
        hidden: false
        readonly: false
        isBody: false
      - name: displayOrder
        type: number
        label: Display Order
        required: false
        default: 0
        hidden: false
        readonly: false
        isBody: false
      - name: body
        type: rich-text
        label: Description
        required: false
        hidden: false
        readonly: false
        isBody: true
    form: false
  - name: inquiries
    label: Customer Inquiries
    description: Submissions from the site's contact form.
    path: content/inquiries
    format: yaml
    view:
      fields:
        - name
        - email
        - status
        - submittedAt
      sort: submittedAt
    fields:
      - name: name
        type: string
        label: Name
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: email
        type: string
        label: Email
        required: true
        hidden: false
        readonly: false
        isBody: false
      - name: phone
        type: string
        label: Phone
        required: false
        hidden: false
        readonly: false
        isBody: false
      - name: serviceAddress
        type: string
        label: Service Address
        required: false
        hidden: false
        readonly: false
        isBody: false
      - name: packageInterest
        type: string
        label: Package Interest
        required: false
        hidden: false
        readonly: false
        isBody: false
      - name: message
        type: text
        label: Message
        required: false
        hidden: false
        readonly: false
        isBody: false
    form: true
    workflow:
      states:
        - { name: new,       label: New,       kind: needs-you }
        - { name: contacted, label: Contacted, kind: needs-you }
        - { name: closed,    label: Closed,    kind: closed }
    notify: []
